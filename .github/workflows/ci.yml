name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      USE_MONGODB: "false"
      DISABLE_OTP: "false"
      ALLOW_UNSIGNED_WEBHOOKS: "false"
      ALLOW_COURIER_SIMULATION: "false"
      NEXT_PUBLIC_ENABLE_DEMO_TOOLS: "false"
      NEXT_PUBLIC_APP_URL: https://example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Run blocking lint checks
        run: npm run lint -- --quiet

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:prod
